# The RV-2AJ has 5 axes, so a full 6-D pose is usually unreachable; KDL solves
# position only (orientation is ignored). Straight TCP moves use rv2aj_control.kinematics (exact
# analytic IK that keeps the tool pitch, like the controller) and MoveIt then
# validates every resulting state.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
